[project]
name = "bg-mcts"
version = "0.1.0"
description = "BG-MCTS flamework"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.9.10",
]

main = [
    "antlr4-python3-runtime==4.9.3",
    "fire==0.7.0",
    "graphviz>=0.20.3",
    "hydra-core==1.3.2",
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "joblib==1.5.1",
    "latex2sympy2-extended==1.10.2",
    "lighteval==0.9.2",
    "math-verify==0.8.0",
    "matplotlib==3.10.3",
    "numpy==2.2.6",
    "numpyro==0.18.0",
    "omegaconf==2.3.0",
    "openai==1.109.1",
    "packaging==25.0",
    "pandas==2.3.0",
    "pillow==11.3.0",
    "pydantic==2.11.9",
    "pymc==5.23.0",
    "pyyaml==6.0.3",
    "python-dotenv==1.1.1",
    "scipy==1.16.2",
    "tqdm==4.67.1",
    "transformers==4.56.2",
    "xarray==2025.6.1",
]

genprm = [
    "vllm==0.10.2",
]

llama = [
    "vllm==0.10.2",
]


[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"


[tool.uv]
prerelease = "allow"
conflicts = [
    [
      { group = "main" },
      { group = "genprm" },
      { group = "llama" },
    ],
]
